<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Погода</title>

<!-- The first frame, and it is deliberately the first thing in the document.
     Everything below this -- the manifest link, the icons, 30 kB of stylesheet
     -- has to be parsed before the browser knows what colour the page is, and
     until it does it paints its own default, which is white. That is the flash
     between the splash disappearing and the app appearing.

     Three lines, so there is nothing to parse. The colour must equal `--sky1`'s
     default further down *and* the manifest's `background_color`, so that the
     launch screen, the first paint and the loaded app are one continuous
     colour and the transition between them is invisible. Written in three
     places because each is read by a different consumer at a different moment;
     a test asserts all three agree. -->
<style>html{background:#0d1630}
@media (prefers-color-scheme:light){html{background:#3f6ba6}}</style>

<!-- ==========================================================================
     NO preconnect. NO dns-prefetch. NO preload. NO third-party anything.

     Those hints open real network connections before a line of JavaScript
     runs, so a leftover one pointing at a font host or a tile server leaks the
     phone's IP even if nothing ever fetches from it. There are none here on
     purpose. If you are about to add one: don't. The whole point of this app
     is that the phone talks to exactly one host.
     ========================================================================== -->

<meta name="theme-color" content="#0d1630" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- `black-translucent`: the sky runs under the clock, which is the point.

     For a long time this was suspected of costing 59pt at the bottom of the
     display. It was not. The viewport measures the full 393x852 with this tag
     in place -- what had been shrinking it to 793 was `position: fixed` on
     `<body>`, applied as a scroll lock. See DECISIONS.md §26. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Погода">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ===========================================================================
   Layout priorities, revised after living with v1:

   1. The temperature is the answer to the question. Everything else is
      supporting evidence -- and v1 spent a third of the first screen on wind,
      humidity and pressure, three numbers nobody opens a weather app for.
      They are now a quiet strip near the bottom.
   2. The second question is always "what about later today", so hourly moves
      directly under the hero and becomes a *curve*. A row of numbers has to
      be read; a line is understood at a glance.
   3. The ten-day list gets range bars. Where a day's low-to-high sits inside
      the whole period is the comparison you are actually making, and a bar
      does it without arithmetic.
   =========================================================================== */

:root{
  --bg:#0a1020; --bg2:#141d33; --card:#161f38; --card2:#1b2542;
  --line:#26314f; --fg:#eef3ff; --dim:#8f9dbe; --faint:#7a86a9;
  --accent:#71a9ff; --warn:#ffb454; --bad:#ff6b6b;
  /* The one place the hourly column width is written down. app.js reads it
     back to lay the curve out on the same grid. It lives on :root rather than
     on .hours so it can be read *before* the strip exists -- the markup is
     built as a string and inserted afterwards, so a value scoped to .hours
     would resolve to nothing on first render and quietly fall back.
     These two numbers disagreed once: 58px in CSS, 54px in JS. The curve
     drifted 4px left per column and stopped 96px short of the last label. */
  --hour-w:58px;
  --hot:#ff9f5a; --cold:#5ec8ff;
  --r:20px;
  /* How wide the content column is allowed to get. Written once because it
     is needed in three places -- the forecast, the sheet's body and its nav
     bar -- and the sheet was the one that forgot: on a desktop window the day
     view sprawled edge to edge while the page behind stayed a neat column. */
  --col:560px;
  /* Written once and used twice: on the canvas (html) and on the visible sky
     layer. They have to agree exactly or the seam is visible on a phone. */
  --skygrad:linear-gradient(180deg,var(--sky1) 0%,
    var(--sky1) var(--skyhold,0%),var(--sky2) 62%,var(--bg) 100%);
  /* How long the sheet takes to arrive, and on what curve. Read back by
     app.js, which has to know when the animation is over to finish tidying
     up -- the same read-it-back rule as --hour-w. */
  --push-ms:460ms;
  --push-ease:cubic-bezier(.32,.72,0,1);
  /* One number for the close button's distance from the header's top, bottom
     and right edges. It is `(header height - button height) / 2` for the
     two-line header the day sheet always has: 74 and 30, so 22. Written down
     here rather than inline because `debug.js` reads it back and asserts the
     three gaps against each other on the device -- the same read-it-back rule
     as `--hour-w` and `--push-ms`. */
  --nav-inset:22px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eef2fa; --bg2:#e2e9f7; --card:#fff; --card2:#f4f7fd;
         --line:#dce3f1; --fg:#0d1526; --dim:#5a6a8c; --faint:#6f7c98;
         --accent:#2563eb; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

/* The canvas background. This is what iOS paints into the notch, the Dynamic
   Island cut-out, the home-indicator strip, the rubber-band overscroll -- and,
   on recent iOS, what Safari spreads into the strips behind its own status bar
   and toolbar. Leave it unset and all of them are black.

   It used to be the flat `--sky1`, and that was wrong in a way that only shows
   up on a phone: one flat colour cannot match a gradient at both ends. The top
   of the sky is a mid blue and the bottom is nearly black, so a canvas painted
   `--sky1` matched the notch and turned the strip behind the bottom toolbar
   into a pale band floating under a dark page.

   So the canvas carries the *same gradient*, fixed to the viewport, and is
   therefore right at both ends at once. `.sky` still paints it too: if a
   browser mishandles `background-attachment:fixed` -- iOS has form here -- the
   page itself is unaffected and only the strips outside it drift.

   **The `background-color` is `--bg`, not `--sky2`.** The gradient is
   `100% 100%, no-repeat`: it covers the viewport and stops, so this flat
   colour is what shows anywhere the gradient does not reach -- the rubber
   band, and, for as long as the viewport was smaller than the display, the
   bottom of the glass. `--sky2` is the gradient's colour at its *62%* stop,
   not its end, so it painted a slice of the middle of the sky wherever it
   showed. Invisible at night, when `--sky2` and `--bg` are both `#0a1020`,
   which is when every screenshot in that investigation was taken.
   DECISIONS.md §26; there is a test over every palette. */
html{
  background-color:var(--bg);
  background-image:var(--skygrad);
  background-attachment:fixed;
  background-repeat:no-repeat;
  background-size:100% 100%;
  transition:background-color 1.2s ease;
}

body{
  background:transparent; color:var(--fg);
  min-height:100vh; min-height:100dvh;   /* dvh: excludes the browser chrome */
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  /* Horizontal insets matter in landscape, where the notch eats a side. */
  /* 10px minimum, not 8: the .edge sampler strips are 10px tall and sit over
     this padding, so anything less would let one clip real content. */
  padding:max(10px,env(safe-area-inset-top))
          max(14px,env(safe-area-inset-right))
          max(28px,env(safe-area-inset-bottom))
          max(14px,env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased;
  /* Stops the bounce from detaching the fixed sky at the edges. */
  overscroll-behavior-y:none;
}
/* ---- materialising out of the launch screen -----------------------------
 * The background is already continuous -- the startup image is the same
 * gradient the first frame paints -- so what remained was the *content*
 * arriving all at once, which reads as a jump even when no colour changed.
 *
 * A fifth of a second of fade turns the handover into the app resolving out
 * of its own launch screen. Deliberately on `.wrap` and not on `#content`:
 * `#content` has its innerHTML replaced on every render, so an animation
 * there would replay on each ten-minute refresh, which is a tic rather than a
 * transition.
 *
 * Nothing is hidden waiting for JavaScript. If the script never runs, this
 * still ends at opacity 1 -- a fade-in gated on a script is a blank page for
 * anyone whose script fails, which is the classic way to make a site worse
 * while trying to make it feel faster.
 *
 * **Opacity only. No transform.** The first version added a 4px rise, which
 * broke the place sheet: `.sheet` is a `position: fixed` descendant of
 * `.wrap`, and a transformed ancestor becomes the containing block for fixed
 * children, so for the 220 ms of the animation the sheet was positioned
 * against the wrapper instead of the viewport. Opacity creates a stacking
 * context, which is harmless; transform creates a containing block, which is
 * not. The browser tests caught it; the eye would not have, because it only
 * misbehaves if you open the sheet inside the first fifth of a second.
 */
.wrap{max-width:var(--col);margin:0 auto;animation:materialise .22s ease-out both}
@keyframes materialise{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .wrap{animation:none}
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.card{background:color-mix(in srgb,var(--card) 86%,transparent);
      border:1px solid var(--line);border-radius:var(--r);
      padding:16px;margin:10px 0;backdrop-filter:blur(10px)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
   margin:0 0 12px;font-weight:600}

/* ---- the sky -------------------------------------------------------------
 * The hero has no card. That is the whole idea, borrowed from Apple Weather:
 * a box with four lines in it reads as *empty*, whereas the same four lines
 * floating on a sky read as *calm*. Same information, same pixels, opposite
 * feeling -- and it costs no extra data, which was the constraint.
 *
 * The backdrop shifts with the conditions and drifts slowly. Everything here
 * is CSS and inline SVG on this origin; no library, no third-party byte.
 */
/* ---- what iOS 26 Safari actually samples ---------------------------------
 * Safari 26 stopped honouring <meta name="theme-color">. The tag still parses;
 * the value is ignored. Instead it derives the colour of the strip behind the
 * status bar and the strip behind the toolbar by sampling a **position:fixed
 * element at that edge of the viewport**, falling back to <body>.
 *
 * Two details make that fatal for a page like this one:
 *
 *   1. It reads `background-color`. A gradient is a `background-image`, and is
 *      simply invisible to the sampler -- so our sky, which is nothing but a
 *      gradient, contributed nothing and Safari picked something arbitrary.
 *   2. It samples at first render and does not re-sample when JavaScript
 *      changes a colour. Which is why the previous fix -- rewriting
 *      theme-color when the sheet opened -- passed its test and did nothing on
 *      a phone twice over.
 *
 * So: two strips, each a *solid colour*, fixed to an edge, matching the sky
 * gradient at exactly that point. They are invisible on the page (they sit on
 * the same colour they are painted) and exist only to be read. Full width and
 * comfortably over the ~6px minimum the sampler requires; no border, because a
 * border-bottom on a sampled element outranks its background-color.
 *
 * Sources: benfrain.com/ios26-safari-theme-color-tab-tinting-with-fixed-position-elements,
 * jahir.dev/blog/safari-toolbar, nasedk.in/blog/ios26-safari-toolbar-colors
 */
.edge{position:fixed;left:0;right:0;height:10px;z-index:0;pointer-events:none}
.edge-top{top:0;background-color:var(--sky1)}
.edge-bot{bottom:0;background-color:var(--bg)}

.sky{position:fixed;inset:-2px;z-index:-1;overflow:hidden;
     height:calc(100dvh + 4px);
     background:var(--skygrad);
     transition:background 1.2s ease}
:root{--sky1:#0d1630;--sky2:#0a1020}
:root[data-sky="clear-night"] {--sky1:#0b1435;--sky2:#0a1020}
:root[data-sky="clear-day"]   {--sky1:#1d4b8f;--sky2:#12294d}
:root[data-sky="cloudy-night"]{--sky1:#141c33;--sky2:#0a1020}
:root[data-sky="cloudy-day"]  {--sky1:#2a4a72;--sky2:#16233d}
:root[data-sky="overcast"]    {--sky1:#232c40;--sky2:#111827}
:root[data-sky="rain"]        {--sky1:#1a2740;--sky2:#0d1524}
:root[data-sky="snow"]        {--sky1:#26314c;--sky2:#131b2c}
@media (prefers-color-scheme: light){
  /* Deeper at the top than you would first choose. iOS forces white status-bar
     glyphs under `black-translucent`, and white on a pale sky is unreadable --
     so the gradient starts saturated and opens out below the hero. */
  :root{--sky1:#3f6ba6;--sky2:#eef2fa;--skyhold:34%}
  :root[data-sky="clear-day"]   {--sky1:#3d80c8;--sky2:#e8f1fd}
  :root[data-sky="clear-night"] {--sky1:#2f4778;--sky2:#eaeff9}
  :root[data-sky="cloudy-day"]  {--sky1:#4d7aab;--sky2:#e9eef7}
  :root[data-sky="cloudy-night"]{--sky1:#3a4d75;--sky2:#e9edf6}
  :root[data-sky="overcast"]    {--sky1:#5b6880;--sky2:#e8ebf1}
  :root[data-sky="rain"]        {--sky1:#48607e;--sky2:#e6ebf3}
  :root[data-sky="snow"]        {--sky1:#5a6d90;--sky2:#eef2f8}
  /* Anything that sits *on the sky* rather than on a card. In light mode the
     sky stays deep at the top -- it has to, because iOS forces white status-bar
     glyphs under `black-translucent` -- so the page's near-black `--fg` would
     be text on a saturated blue. Every element in this list is one that has no
     card behind it; adding a new one without adding it here is how a heading
     ends up invisible in daylight and nowhere else.
     **The sheet is not sky.** It is flat `--bg` (§26), near-white here, and
     its title and day hero were left on this list from the full-screen push:
     white on #eef2fa, 1.1:1. Its strip gets ink on a segmented control. */
  body .hero,body .top{color:#fff}
  body .hero .cond,body .hero .sub .lo{color:rgba(255,255,255,.82)}
  body .hero .feels{color:rgba(255,255,255,.66)}
  .screen .srcs{background:var(--bg2);border-color:var(--line)}
  .screen .src{color:var(--dim)}
  .screen .src b{color:var(--fg)}
  .screen .src.sel{background:var(--card);color:var(--fg)}
  .screen .src.sel b{color:var(--accent)}
  body .placebtn svg{stroke:rgba(255,255,255,.72)}
  body .placebtn .pin{fill:rgba(255,255,255,.85)}
  /* Stars over a sky that opens out to near-white read as dust. Keep them,
     faintly, only where the sky is still deep. */
  .sky .stars{opacity:.5}
}
/* ---- weather, moving ------------------------------------------------------
 * Every layer here is one `<i>` inside `#sky`, and every one of them animates
 * `transform` or `opacity` and nothing else -- those two are the only
 * properties the compositor can run without asking the main thread, and the
 * main thread on this page is busy drawing a temperature curve.
 *
 * **Two ways a loop can show its seam, and both had shipped.**
 *
 * 1. A pattern that repeats every P pixels may only be moved by a whole
 *    multiple of P, or the wrap is a jump. The rain was an angled
 *    `repeating-linear-gradient(104deg, ... 46px)`: 46px along the gradient's
 *    own axis, which is 46/cos14° = **190px measured vertically**, while the
 *    animation moved 14% of a 1198px layer = **168px**. Every 0.85 seconds the
 *    whole screen twitched 22 pixels sideways. Snow was worse -- 52px of a
 *    220px tile -- and got away with it only by being nine times slower.
 *
 *    So the slant is a **skew**, not a gradient angle. `skewX` leaves y alone,
 *    so the vertical period stays exactly `--tile`, which is also exactly what
 *    the keyframe travels. Seamless by construction rather than by tuning, and
 *    `--tile` may be changed to anything without re-deriving a trigonometric
 *    constant. (Order matters in the keyframe: skew *then* translate, so the
 *    translation happens in the skewed frame and the drops travel along their
 *    own streaks -- which is both correct and the only way rain looks right.)
 *
 * 2. A drift that runs `from -6% to 6%` linearly has to teleport home. Nothing
 *    forgives that on a 90-second cycle. Clouds and haze therefore run
 *    `alternate`, which has no wrap at all; at these speeds an oscillation is
 *    indistinguishable from weather milling about.
 *
 * The parameters are custom properties so a variant is a line, not a ruleset.
 */
.sky i{position:absolute;display:block;pointer-events:none}

/* Everything above lives inside this, and it exists for the mask.
 *
 * The sky opens out to `--bg` at the foot of the screen -- to near-white in
 * daylight -- so rain drawn at full strength all the way down is invisible for
 * the bottom third and, worse, is drawn *behind the cards*, adding motion under
 * text for no gain at all. Fading it out where the gradient pales keeps the
 * weather in the part of the screen that is sky, which is also the only part
 * anyone reads it from.
 *
 * The mask is on this wrapper and not on the layers themselves, and that is not
 * tidiness: a mask lives in its element's own coordinate system, so a mask on a
 * translating layer travels with it and the fade would slide down the screen
 * once a second.
 *
 * **The top fade is a measurement, not a taste.** `.edge-top` is ten points of
 * flat `--sky1` painted over the sky, so iOS 26 has an opaque element to sample
 * for the status-bar tint (§14). Anything this wrapper adds lands *under* those
 * ten points and *over* everything below them, so the sky brightens at exactly
 * y=10 and the phone shows a hard line there. Sampling the render proved it:
 * rgb(35,44,64) above, rgb(41,50,70) below, +6 per channel with no ramp. Small
 * on paper; on an OLED at night it is the first thing you see.
 *
 * So the mask holds **zero until 3%** -- 25pt, comfortably past the strip --
 * and only reaches full at 26%. At y=10 the sky is therefore untouched and
 * matches `.edge-top` exactly, and the ramp below is spread over 190pt, which
 * is far too gradual to read as an edge. Change the strip's height and this
 * number has to move with it; there is a test that samples the pixels. */
.sky .fx{position:absolute;inset:0;overflow:hidden;
  mask-image:linear-gradient(180deg,transparent 0 3%,#000 26% 64%,
    rgba(0,0,0,.62) 86%,transparent 100%)}

/* Overcast, and the one shape that cannot go wrong on a screen nobody here
   can see: **a flat tint with no spatial structure whatsoever.** Its only
   variable is opacity. A gradient blob has a bright part and a dim part and
   therefore an edge somewhere, and placing that edge correctly on a device you
   are not holding turns out to be beyond this harness -- two attempts, two
   reports of a visible band across the top of the phone, and a render here
   that looked right both times. Flat cannot band. */
.sky .h{inset:0;background:rgba(255,255,255,var(--a));
  animation:breathe var(--t) ease-in-out infinite alternate}
.sky .h.thin {--a:.030;--t:15s;--o0:.35;--o1:.85}
.sky .h      {--a:.045;--t:13s;--o0:.40;--o1:.95}
.sky .h.thick{--a:.062;--t:11s;--o0:.50;--o1:1}

/* precipitation. `--tile` is the vertical repeat and the travel, and they are
   the same token twice on purpose -- see above. `--gap` is the horizontal
   spacing, and the two layers of any shower are given gaps with no common
   factor (26 and 41, not 20 and 40): tiled patterns at related spacings line
   up into a plaid, which is what the first draft of this looked like. */
.sky .p{inset:-55% -25% -12%;animation:fall var(--t) linear infinite}
.sky .rain{--tile:40px;--gap:26px;--t:1.15s;--sk:-13deg;--a:.30;
  background:radial-gradient(.6px 7px at 50% 30%,rgba(178,212,255,var(--a)),transparent);
  background-size:var(--gap) var(--tile)}
.sky .snow{--tile:46px;--gap:46px;--t:13s;--sk:-4deg;--a:.75;
  background:radial-gradient(1.6px 1.6px at 28% 20%,rgba(255,255,255,var(--a)),transparent),
             radial-gradient(1.2px 1.2px at 71% 64%,rgba(255,255,255,var(--a)),transparent);
  background-size:var(--gap) var(--tile)}
.sky .hail{--tile:30px;--gap:22px;--t:.7s;--sk:-7deg;--a:.6;
  background:radial-gradient(1.4px 2.2px at 50% 40%,rgba(226,238,255,var(--a)),transparent);
  background-size:var(--gap) var(--tile)}
/* the weights: morosity through downpour, and the near layer that gives a
   shower its depth. `close` is bigger, brighter and faster -- parallax is
   mostly a speed difference and the eye supplies the rest. */
.sky .thin {--a:.20;--t:1.9s;--gap:34px;--tile:34px}
.sky .hard {--a:.42;--t:.8s;--gap:17px;--tile:34px}
.sky .close{--a:.40;--t:.82s;--gap:41px;--tile:62px;
  background:radial-gradient(.9px 11px at 50% 30%,rgba(196,222,255,var(--a)),transparent);
  background-size:var(--gap) var(--tile)}
.sky .fast {--t:8s;--gap:34px;--tile:34px;--a:.85}
.sky .slow {--t:19s;--gap:62px;--tile:62px;--a:.6}

/* fog: bands that drift *down* rather than across, breathing as they go.
   Horizontal motion in horizontal bands is invisible, which is the sort of
   thing that is obvious only once you have animated it. Soft stops rather
   than hard ones -- fog with an edge is a venetian blind. */
.sky .b{inset:-60% -10% -10%;--tile:88px;--t:34s;--o0:.5;--o1:1;
  background:repeating-linear-gradient(180deg,
    rgba(255,255,255,0) 0,rgba(255,255,255,.10) 26px,
    rgba(255,255,255,0) 52px,rgba(255,255,255,0) var(--tile));
  animation:fall var(--t) linear infinite,breathe 11s ease-in-out infinite alternate}

/* the sun, and the moon, which is the same gradient with the warmth taken out */
.sky .g{inset:-30% -30% auto;height:70%;
  animation:breathe var(--t) ease-in-out infinite alternate}
.sky .sun {--o0:.55;--o1:1;--t:12s;
  background:radial-gradient(46% 52% at 62% 12%,rgba(255,232,180,.42),
             rgba(255,214,150,.14) 45%,transparent 72%)}
.sky .moon{--o0:.4;--o1:.75;--t:16s;
  background:radial-gradient(34% 40% at 70% 14%,rgba(206,224,255,.26),transparent 70%)}

/* After dark the drops are dimmer and colder. Only `clear`, `partly` and
   `cloudy` carry the hour inside their icon -- rain at midnight is still
   spelled `rain` -- so the flag comes from the envelope and lands here. */
:root[data-night] .sky .rain {--a:.24}
:root[data-night] .sky .close{--a:.32}
:root[data-night] .sky .snow {--a:.62}
:root[data-night] .sky .h    {--o1:.7}
.sky .stars circle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes fall{from{transform:skewX(var(--sk,0deg)) translate3d(0,calc(var(--tile) * -1),0)}
                to  {transform:skewX(var(--sk,0deg)) translate3d(0,0,0)}}
@keyframes sway{from{transform:translate3d(calc(var(--sw) * -1),0,0) scale(var(--sc))}
                to  {transform:translate3d(var(--sw),0,0) scale(var(--sc))}}
@keyframes breathe{from{opacity:var(--o0,.45)}to{opacity:var(--o1,.8)}}
/* In daylight the sky is pale, and white-on-pale is nothing at all. The drops
   go dark rather than light -- which is also what rain looks like against a
   bright sky, so the honest colour and the legible one agree for once. Snow
   stays white: it is only ever drawn over the deep half of the gradient, where
   white is what it should be. */
@media (prefers-color-scheme: light){
  .sky .rain,.sky .hail{--a:.34;
    background:radial-gradient(.6px 7px at 50% 30%,rgba(56,84,124,var(--a)),transparent);
    background-size:var(--gap) var(--tile)}
  .sky .close{--a:.4;
    background:radial-gradient(.9px 11px at 50% 30%,rgba(48,74,112,var(--a)),transparent);
    background-size:var(--gap) var(--tile)}
  .sky .b{background:repeating-linear-gradient(180deg,
    rgba(120,140,170,0) 0,rgba(120,140,170,.13) 26px,
    rgba(120,140,170,0) 52px,rgba(120,140,170,0) var(--tile))}
}
@media (prefers-reduced-motion: reduce){
  /* Stopped, not removed: the still frame of every one of these is a
     legitimate picture of the weather, and a reader who asked for less motion
     asked for less motion, not for a flat rectangle. */
  .sky .fx i,.sky .fx .stars circle{animation:none}
}

/* ---- top bar -------------------------------------------------------------
 * One control, centred over the sky. v2 had a city name plus two boxed icon
 * buttons plus a scrolling row of city bubbles -- four affordances for a
 * choice made twice a month. A hamburger would have been an improvement but
 * still the wrong label: a menu icon promises a menu of things, and there is
 * only one thing in it. The place name IS the button.
 */
.top{display:flex;justify-content:center;padding:14px 0 0}
.placebtn{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 6px;
          max-width:100%}
.placebtn h1{font-size:30px;font-weight:590;margin:0;letter-spacing:-.02em;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placebtn svg{width:16px;height:16px;flex:none;stroke:var(--faint);fill:none;
              stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
              margin-top:4px}
.placebtn:active{opacity:.6}
/* Hidden by visibility: its slot balances the chevron, centring the name. */
.placebtn .pin{width:15px;height:15px;stroke:none;fill:var(--dim);margin-top:3px}

/* ---- the sheet -----------------------------------------------------------
 *
 * A resizable bottom sheet, not a full-bleed push. Six attempts went into
 * making a push work here before the shape of the problem was clear: **a
 * full-screen panel promises the whole display, and this display keeps 59
 * points back** (DECISIONS.md §26). A panel that claims the glass and stops
 * short looks broken; a sheet never claimed it.
 *
 * Modelled on `UISheetPresentationController`: two detents, a grabber, a
 * dimming view behind, scroll locked at the smaller detent so a drag resizes
 * instead of scrolling. The curve is `cubic-bezier(.32,.72,0,1)` over 460ms --
 * Ionic's, matched to iOS's, already written down as `--push-ease`.
 *
 * `history.pushState` still drives dismissal, so the system edge-swipe still
 * closes it. Invariant 13 governs *horizontal* gestures, which belong to the
 * system; a vertical drag does not collide and is the one thing that makes a
 * sheet feel real rather than drawn.
 */
:root{
  /* The large detent: how far the sheet's top sits below the display's. Enough
     that a strip of the forecast stays visible above it, which is what tells
     you the page is still there. */
  --sheet-top:calc(max(52px,env(safe-area-inset-top)) + 12px);
  /* The medium detent, as a fraction of the sheet's own height. iOS's medium
     is roughly half the screen; this is a shade taller because a day's four
     parts are the thing worth showing without a second gesture. */
  --sheet-mid:38%;
}
.screen{position:fixed;top:var(--sheet-top);left:0;right:0;bottom:0;z-index:60;
  display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;overflow:hidden;
  /* Flat `--bg`, not the sky gradient the push used, and both halves of that
     matter. A sheet is a surface lifted off the page rather than a second sky
     -- and its bottom row has to be exactly the colour the canvas paints below
     the viewport, which a gradient cannot be asserted to be. There is a test. */
  background-color:var(--bg);
  box-shadow:0 -.5px 0 color-mix(in srgb,var(--fg) 10%,transparent),
             0 -20px 50px rgba(0,0,0,.55)}
/* **`visibility` is delayed on the way out and instant on the way in**, and
   writing it as one duration cost the whole first half of the entrance.
   `transition: visibility 460ms` does not fade anything -- visibility is a
   discrete property, and WebKit flips it at the midpoint of the duration. So
   the sheet was invisible for the first 230ms of a 460ms travel and *appeared*
   a third of the way up the screen, already moving. That is the "pop-up starts
   from the wrong position" this project chased for weeks and never measured;
   `static/debug.js` finally caught it on the device, reporting a first visible
   Y of 533 where 781 was expected -- and 781 - (230/460) x 484 = 539.
   The delay belongs only on the exit, where it keeps the sheet on screen until
   it has finished leaving. */
.screen{visibility:hidden;transform:translateY(100%);
  transition:transform var(--push-ms) var(--push-ease),
             visibility 0s linear var(--push-ms)}
.screen.open{visibility:visible;
  transition:transform var(--push-ms) var(--push-ease),visibility 0s}
/* While a finger is on it the transform is set frame by frame, so the
   transition has to be out of the way or every move is chasing a 460ms ease. */
.screen.dragging{transition:none}
/* At the medium detent the content does not scroll: dragging resizes the sheet
   instead. That is `prefersScrollingExpandsWhenScrolledToEdge`, iOS's default,
   and it is why the grabber is honest -- at this size the whole surface is a
   handle. */
.screen[data-detent="mid"] .body{overflow:hidden}
.screen::before{content:'';position:absolute;top:7px;left:50%;margin-left:-18px;
  width:36px;height:5px;border-radius:3px;z-index:3;
  background:var(--fg);opacity:.28}
/* The dimming view. Its opacity is driven from JS so it tracks the drag rather
   than snapping at the ends -- that coupling is most of the illusion that the
   sheet is a physical thing being moved. Tapping it dismisses, which is what
   iOS's non-interactive dimming view does. */
.scrim{position:fixed;inset:0;z-index:55;background:#000;opacity:0;
  visibility:hidden;transition:opacity var(--push-ms) var(--push-ease),
                              visibility 0s linear var(--push-ms)}
.scrim.open{visibility:visible;
  transition:opacity var(--push-ms) var(--push-ease),visibility 0s}
.scrim.dragging{transition:none}
/* The last 56 points of the *viewport*, faded to the colour beyond it.
 *
 * Fixed rather than inside the sheet, and that is not fussiness: at the medium
 * detent the sheet's own bottom edge is somewhere below the fold, so a fade
 * anchored to it would be invisible exactly when it is needed. This one is
 * anchored to the glass. Its job is that no card ever meets the bottom of the
 * view at a hard horizontal edge, at any detent or scroll position. */
.sheetfade{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:61;
  pointer-events:none;opacity:0;visibility:hidden;
  background:linear-gradient(to bottom,transparent,var(--bg));
  transition:opacity var(--push-ms) var(--push-ease),
             visibility 0s linear var(--push-ms)}
.sheetfade.open{opacity:1;visibility:visible;
  transition:opacity var(--push-ms) var(--push-ease),visibility 0s}
@media (prefers-reduced-motion: reduce){
  .screen{transition:none}
}
/* Translucent, so content scrolls up *under* the title rather than being
   clipped by a solid band -- the detail that makes a header read as chrome
   belonging to the screen instead of a box drawn on top of it. */
/* The bar spans the window; its *contents* do not. `calc((100% - var(--col))/2)`
   is the gutter that would centre a column of `--col`, and `max()` discards it
   below that width -- so one padding rule gives a full-bleed blurred bar on a
   desktop and edge-to-edge chrome on a phone, with no extra element. */
.navbar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:8px;
  /* No safe-area inset any more: the sheet starts below the status bar, so
     spending 59pt here again would push the title into the middle of it.

     The 22 is the grabber's room. */
  padding-top:22px;padding-bottom:10px;
  padding-right:max(10px,env(safe-area-inset-right),calc((100% - var(--col))/2));
  padding-left:max(10px,env(safe-area-inset-left),calc((100% - var(--col))/2));
  /* Opaque, unlike the push's translucent bar. Content scrolling under a
     blurred bar is the right effect on a full screen and the wrong one on a
     sheet, where the rounded top corners are the edge of an object and things
     should not be visible sliding behind it. */
  background:var(--bg);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);
  /* The close button is positioned against this rather than laid out by the
     grid -- see below for why. */
  position:relative}
/* Trailing close, **not** a leading back chevron. Shipped wrong once; the rule
   is old and explicit -- a control's side encodes how the panel arrived. Slid
   in from the right, further into the hierarchy: «Back», on the left. Slid up
   from the bottom, a modal over a page that is still there: dismissed, on the
   right. A chevron here claims a navigation that did not happen.

   An X rather than «Готово»: Apple's own line is "avoid using Done buttons for
   things other than completing the task", and there is no task -- you read a
   day and close it. `UIBarButtonItem.SystemItem.close`, which is what the App
   Store and Photos put on a sheet you only read. Grey, not accent: it is a way
   out, not the point of the screen.

   Not redundant with the grabber. That says the sheet resizes and can be
   flicked away; this is the explicit, reachable, labelled version. */
/* **Out of the grid, and centred on the header's border box.**
 *
 * Twice wrong before this. First it centred on the two-line title block, which
 * put it 8pt below «Сегодня» and read as not-quite-centred. Then it centred on
 * the title's *first line*, which is where the eye pairs it — but the header is
 * taller than the title: the grabber lives above it, and the bar's padding is
 * asymmetric (22 above for the grabber, 10 below). Anything laid out by the
 * grid centres within the **content** box, and a content box with 12px more
 * padding above than below is not centred in the bar you can see.
 *
 * `position: absolute` with `top: 0; bottom: 0; margin-block: auto` centres on
 * the *padding* box — the whole header, grabber included — and does it for any
 * title height, one line or two. That is the only version of this that is
 * exact rather than tuned.
 *
 * `--nav-inset` is then the gap on all three sides at once: the button's
 * distance from the header's top, bottom and right edges are one number. It is
 * `(header height − 30) / 2` for the two-line header the day sheet always has,
 * and `debug.js` checks the three against each other on the device rather than
 * trusting this arithmetic. */
.navbar .close{position:absolute;top:0;bottom:0;
  right:max(var(--nav-inset),calc((100% - var(--col))/2));
  margin-block:auto;
  display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;border:0;padding:0;
  background:color-mix(in srgb,var(--fg) 12%,transparent)}
/* The viewBox is the **ink**, which it was not before: the old path ran from 6
   to 18 of a 24-unit box, so a "15px" icon drew a 7.5pt mark inside a 30pt
   circle -- a quarter of its width, swimming in ring. `debug.js` measures this
   with `getBBox`, which is why it is the one property here stated as a ratio:
   iOS's is a little over a third. */
.navbar .close svg{width:13px;height:13px;stroke:var(--dim);fill:none;
  stroke-width:2.1;stroke-linecap:round}
.navbar .close:active{opacity:.55}
.navbar .t{grid-column:2;font-size:16.5px;font-weight:600;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .t small{display:block;font-size:12px;font-weight:500;
  color:var(--faint);letter-spacing:.02em}
/* No bottom padding at all, and the last card carries no bottom margin, so the
   content runs to the edge of the display.

   It used to have a 28px floor, which on a phone became 34px of safe area plus
   the card's own 10px margin: forty-odd pixels of empty sky under every day
   screen, reported as "a tab bar that forgot to draw itself". The forecast
   page never showed it because its footer fills that space. Reserving the
   home-indicator inset instead still left 34px of nothing, which is the same
   complaint one third smaller.
   Scrollable content is allowed to pass under the home indicator -- only
   controls are not -- and this screen is a list of numbers. */
.screen .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding-top:2px;padding-bottom:0;
  padding-right:max(14px,env(safe-area-inset-right),calc((100% - var(--col))/2));
  padding-left:max(14px,env(safe-area-inset-left),calc((100% - var(--col))/2))}
.screen .body > :last-child{margin-bottom:0}



/* The screen ends with a quiet line rather than a card's hard edge -- the
   forecast page has always ended this way and nobody has ever remarked on the
   same 59pt of nothing below it. DECISIONS.md §26. */
.screenfoot{margin:22px 0 0;padding-bottom:30px;text-align:center;
  color:var(--faint);font-size:13px}
.screen input{width:100%;padding:13px 16px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);color:var(--fg);font-size:17px;outline:none;
  margin:10px 0 4px}
.screen input:focus{border-color:var(--accent)}
.screen h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
          color:var(--faint);margin:18px 17px 8px;font-weight:600}

/* Not a cell. As a single-row group it sat directly under the search field at
   the same width and the same corner radius, so the two read as a pair of
   inputs rather than a field and an action. Stripping the box is the whole
   fix: an accent-coloured line with an arrow is unmistakably a thing you do,
   not a thing you pick from a list. */
.geolink{display:flex;align-items:center;gap:9px;width:100%;
  padding:13px 17px 3px;color:var(--accent);font-size:15.5px;font-weight:560}
.geolink svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;
             stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.geolink:active{opacity:.55}
.geolink .on{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--faint);
             text-transform:uppercase;letter-spacing:.06em}

/* A grouped inset list, not a stack of separate pills. One rounded container,
   hairline separators inset to the text -- the thing every iOS settings screen
   does, because a row is part of a list rather than an object in its own
   right. Individually rounded cells make seven cities look like seven
   unrelated buttons. */
.group{list-style:none;margin:0 0 2px;padding:0;background:var(--card);
       border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group li{display:flex;align-items:center;gap:13px;padding:15px 16px;
          font-size:17px;position:relative;cursor:pointer}
.group li + li::before{content:"";position:absolute;left:16px;right:0;top:0;
                       height:1px;background:var(--line)}
.group li.icon + li::before,.group li + li.icon::before{left:52px}
.group li:active{background:var(--card2)}
.group li.sel{color:var(--accent)}
.group .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis}
.group .sub{color:var(--faint);font-size:14px;flex:none;max-width:44%;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group svg{width:20px;height:20px;flex:none;stroke:var(--accent);fill:none;
           stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.group .tick{width:17px;height:17px}
.empty{padding:22px 4px;text-align:center;color:var(--faint);font-size:15px}

/* `overflow: hidden` on the scrolling element, and **not** `position: fixed`
   on `<body>`.

   The note that used to be here said iOS ignores `overflow: hidden` and that
   pinning the body is the only thing that works. That was true, and stopped
   being true in **iOS 16.3**, when WebKit fixed it. This phone is on 26.

   Pinning the body is not merely unnecessary now, it is expensive in the one
   place it cannot afford to be. Switching `<body>` from static to fixed
   relayouts the entire document, and `openScreen` did it in the same task that
   starts the sheet's transition -- so the main thread went off to reflow a
   ten-day forecast while the animation was supposed to be painting its first
   frames. Two screen recordings, measured frame by frame, showed the sheet
   invisible for the first half of its travel and then appearing at 505pt and
   573pt already moving. The scroll-offset save/restore (`window.scrollTo` on
   the way out) did the same thing to the exit.

   `overflow: hidden` changes no geometry, so there is no reflow, and the
   scroll position is preserved for free -- nothing moved. `overscroll-behavior`
   stops the rubber band underneath.

   Sources: benfrain.com/preventing-body-scroll-for-modals-in-ios,
   weser.io/blog/scroll-blocking-overlays (which dates the WebKit fix).

   On `<html>`, not `<body>`: `document.scrollingElement` is the root, and the
   sheet's own scroller is a descendant of `<body>` -- locking the body would
   be locking an ancestor of the thing that still has to scroll. */
html.locked{overflow:hidden;overscroll-behavior:none}

/* ---- day detail ----------------------------------------------------------
 * Three sources, three shapes, deliberately. Яндекс publishes four parts of a
 * day; Gismeteo publishes fifteen metric rows and no parts; Open-Meteo
 * publishes an hour at a time for ten days and no summary of any of it.
 *
 * The obvious design is one table with a row per field, and it is the wrong
 * one: two thirds of it would be blank on any given tab, and a blank cell in a
 * table reads as *missing data* rather than as "this source does not work that
 * way". So each source gets the layout it is actually good at, and the tab
 * strip is what changes the shape.
 */
.dayhero{display:flex;align-items:center;gap:14px;padding:14px 4px 12px}
.dayhero svg{width:62px;height:62px;flex:none}
.dayhero .r{font-size:34px;font-weight:300;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.05}
.dayhero .r .lo{color:var(--dim)}
.dayhero .c{font-size:15px;color:var(--dim);margin-top:2px;line-height:1.3}

/* Parts of day: a row each, because they are a sequence through the day and a
   grid of four boxes loses that ordering. */
.part{display:flex;align-items:center;gap:11px;padding:11px 0}
.part + .part{border-top:1px solid var(--line)}
.part .n{width:62px;flex:none;font-size:15px;text-transform:capitalize}
.part svg.wi{width:30px;height:30px;flex:none}
.part .tt{width:52px;flex:none;text-align:right;font-size:20px;font-weight:520;
  font-variant-numeric:tabular-nums}
.part .m{flex:1;min-width:0;font-size:12.5px;color:var(--faint);line-height:1.35}
/* Wraps rather than truncating. «Облачно с прояснениями» does not fit and an
   ellipsis in a four-row list is a worse answer than a second line -- the rows
   are already unequal, since only some parts of the day carry a feels-like. */
.part .m b{display:block;color:var(--dim);font-weight:500;font-size:13.5px}

/* The metrics table: label left, value right, one per line. A grid of tiles
   was tried and is worse here -- fifteen tiles is a wall, and these are read
   one at a time by someone looking for one of them. */
.metric{display:flex;align-items:baseline;gap:10px;padding:9px 0;font-size:15px}
.metric + .metric{border-top:1px solid var(--line)}
.metric .k{color:var(--dim);flex:1;min-width:0}
.metric .v{font-variant-numeric:tabular-nums;font-weight:520;text-align:right;
  white-space:nowrap}
.metric .v small{color:var(--faint);font-weight:400;margin-left:4px}

/* Said out loud when a source has nothing for this day, instead of an empty
   card. An empty card is indistinguishable from a broken one. */
.nodata{padding:22px 6px;text-align:center;color:var(--faint);font-size:14.5px;
  line-height:1.5}

/* ---- hero: no card, on the sky ------------------------------------------ */
.hero{text-align:center;padding:2px 0 20px}
.hero .ic{width:88px;height:88px;margin:2px auto -8px}
.hero .ic svg{display:block;width:100%;height:100%}
.hero .t{font-size:96px;font-weight:180;letter-spacing:-.055em;line-height:1;
         font-variant-numeric:tabular-nums;margin-left:-.06em}
.hero .cond{font-size:21px;font-weight:480;margin:4px 0 0;color:var(--dim)}
.hero .sub{font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .sub .hi{font-weight:560}
.hero .sub .lo{color:var(--dim)}
.hero .feels{font-size:15px;color:var(--faint);margin-top:3px}

/* ---- source strip --------------------------------------------------------
 * This sits on the sky, and the sky changes colour with the weather. So the
 * selected pill cannot be a fixed colour: --card2 read clearly against a deep
 * night sky and all but disappeared against a pale overcast one, which meant
 * "which source am I looking at" was answerable only on some days.
 *
 * Fixed-alpha white over whatever is behind it holds its contrast on every
 * sky, in both colour schemes -- the same reason iOS builds segmented controls
 * out of translucency rather than palette colours. The text is pinned light
 * for the same reason: this strip never sits on a card, always on sky.
 */
.srcs{display:flex;gap:3px;margin:6px 0 0;padding:4px;border-radius:15px;
      background:rgba(8,14,30,.30);border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(12px)}
.src{flex:1;padding:8px 4px;border-radius:11px;font-size:12.5px;font-weight:560;
     color:rgba(255,255,255,.60);text-align:center;line-height:1.3;min-width:0}
.src.sel{background:rgba(255,255,255,.17);color:#fff;
         box-shadow:0 1px 3px rgba(0,0,0,.26)}
.src[disabled]{opacity:.55}
.src b{display:block;font-size:14px;font-weight:640;
       color:rgba(255,255,255,.72);
       font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis}
.src.sel b{color:#9cc6ff}

/* ---- the summary line, at the head of the hourly card ------------------- */
.nowcast{display:flex;gap:10px;align-items:flex-start;font-size:15px;
  color:var(--dim);padding-bottom:14px;margin-bottom:12px;
  border-bottom:1px solid var(--line);line-height:1.4}
.nowcast svg{width:18px;height:18px;flex:none;margin-top:1px;opacity:.8}

/* ---- hourly curve -------------------------------------------------------
 * `overflow: auto hidden`, and the second word is load-bearing. Setting only
 * `overflow-x: auto` does not leave the other axis alone: the spec says that
 * when one axis is not `visible`, a `visible` on the other computes to `auto`.
 * So the strip quietly became vertically scrollable, and it only took *two
 * pixels* of overflow for that to be noticeable -- a drag down the curve
 * scrolled the widget instead of the screen behind it.
 *
 * The two pixels are fixed below as well, at their source. This is the
 * structural half: a strip that scrolls sideways must never acquire a second
 * scroll axis because somebody changed a font size.
 */
.hours{overflow:auto hidden;scrollbar-width:none;margin:0 -16px;padding:0 16px;
       overscroll-behavior-x:contain}
.hours::-webkit-scrollbar{display:none}
.hstrip{display:flex;position:relative}
.hcurve{position:absolute;left:0;top:0;pointer-events:none}
.hour{flex:none;width:var(--hour-w);text-align:center;position:relative;z-index:1}
.hour .gz{height:72px;position:relative}
.hour .hv{position:absolute;left:0;right:0;text-align:center;font-size:15px;
          font-weight:600;font-variant-numeric:tabular-nums}
.hour svg.wi{width:26px;height:26px;margin:2px 0 3px;display:block;
             margin-left:auto;margin-right:auto}
.hour .hh{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
/* Millimetres, only on the hours that have any. Always-present and mostly
   empty would be a row of noise; the blank is the information. The row keeps
   its height either way so the strip does not jump as the forecast changes. */
/* `line-height` stated, not inherited. The body's 1.45 over 11.5px is a
   16.7px line box in a 15px-high element -- 2px of overflow, invisible on the
   page and quite visible under a finger, because it was enough to make the
   whole strip a scroll container. */
.hour .hp{height:15px;line-height:15px;font-size:11.5px;font-weight:600;
          color:var(--cold);font-variant-numeric:tabular-nums}
.hour.now .hh{color:var(--accent);font-weight:650}

/* ---- daily with range bars ---------------------------------------------- */
.day{display:flex;align-items:center;gap:10px;padding:9px 0;width:100%;
     text-align:left}
.day + .day{border-top:1px solid var(--line)}
.day:active{opacity:.55}
/* The chevron says the row goes somewhere. Small and faint: it is an
   affordance, not a decoration, and ten of them in a column at full contrast
   would be a stripe down the side of the card. */
.day svg.go{width:15px;height:15px;flex:none;stroke:var(--faint);fill:none;
            stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
            opacity:.65;margin-left:-2px}
.day .d{width:82px;flex:none;font-size:16px;line-height:1.15}
.day .d small{display:block;color:var(--faint);font-size:12.5px}
.day svg.wi{width:28px;height:28px;flex:none}
.day .lo,.day .hi{font-size:16px;font-variant-numeric:tabular-nums;flex:none;
                  width:40px;text-align:right}
.day .lo{color:var(--dim)}
.bar{flex:1;height:5px;border-radius:99px;background:var(--line);position:relative;
     min-width:40px;margin:0 3px}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px;
       background:linear-gradient(90deg,var(--cold),var(--hot))}
.bar u{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;
       background:var(--fg);transform:translate(-50%,-50%);
       box-shadow:0 0 0 2px var(--card)}

/* ---- the quiet strip: what v1 put at the top ---------------------------- */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
       background:var(--line);border-radius:14px;overflow:hidden}
.fact{background:var(--card);padding:13px 14px}
.fact .k{color:var(--faint);font-size:11.5px;text-transform:uppercase;
         letter-spacing:.06em;white-space:nowrap}
.fact .v{font-size:17px;font-weight:560;font-variant-numeric:tabular-nums;
         margin-top:1px;white-space:nowrap;letter-spacing:-.01em}
/* "0,8 м/с СЗ" does not fit a third of the width at full size. The direction
   is the least important half of it, so it shrinks rather than wrapping. */
.fact .v small{font-size:13.5px;font-weight:500;color:var(--faint);
               letter-spacing:0}

/* ---- footer / health ---------------------------------------------------- */
/* Was a single flex-wrap row, which meant the browser decided where to break
   it -- and on a 393pt screen it put the timestamp and the badge together and
   orphaned "Обновить" on its own line. Two explicit rows instead: the badge
   only when there is one, then one line that always fits. */
.foot{display:flex;flex-direction:column;align-items:center;gap:9px;
      margin:20px 0 4px;color:var(--faint);font-size:13.5px}
.foot .line{display:flex;align-items:center;gap:9px;white-space:nowrap}
.foot .sep{opacity:.45}
#stamp:empty+.sep{display:none}
.badge{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
       border:1px solid}
.badge.ok{display:none}
.badge.degraded,.badge.stale{color:var(--warn);border-color:var(--warn)}
.badge.down{color:var(--bad);border-color:var(--bad)}
.notes{margin:10px 0 0;padding:11px 14px;border-radius:13px;font-size:12.5px;
       border:1px solid var(--warn);color:var(--warn);display:none;
       background:color-mix(in srgb,var(--warn) 9%,transparent)}
.notes.show{display:block}
.notes ul{margin:5px 0 0;padding-left:17px}
.notes summary{font-weight:600;cursor:pointer}
.hide{display:none}
/* ---- the skeleton -------------------------------------------------------
 * What you see for the fraction of a second before the cached payload
 * renders, and for longer on a cold install. It used to be the hero at 30%
 * opacity showing "—°", which reads as a broken app rather than a loading
 * one.
 *
 * Now it is the *shape* of the answer: the icon, the temperature, the source
 * strip, two cards. Nothing pretends to be data -- there are no fake numbers
 * anywhere, which is the same rule the rest of this codebase follows about
 * plausible wrong values. It is furniture, and furniture is honest.
 */
/* Announced, not shown. The skeleton is `aria-hidden` -- a screen reader has
   no use for the shape of a card -- so something has to say what is going on,
   and "Загружаем погоду…" is that thing. */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skel{opacity:.3}
.boot{padding:2px 0 0}
.boot i{display:block;border-radius:14px;
        background:linear-gradient(90deg,
          rgba(255,255,255,.10) 0%, rgba(255,255,255,.18) 50%,
          rgba(255,255,255,.10) 100%);
        background-size:200% 100%;
        animation:sheen 1.6s ease-in-out infinite}
.boot .ic{width:84px;height:84px;border-radius:50%;margin:6px auto 14px}
.boot .t{width:184px;height:76px;margin:0 auto 14px;border-radius:18px}
.boot .c{width:150px;height:20px;margin:0 auto 26px}
.boot .strip{height:56px;border-radius:16px;margin:0 0 10px}
.boot .card{height:150px;border-radius:var(--r);margin:0 0 10px}
.boot .card.tall{height:300px}
@keyframes sheen{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){
  /* The pulse is the only thing saying "working"; without motion, a steady
     block says the same thing quietly rather than not at all. */
  .boot i{animation:none;background:rgba(255,255,255,.13)}
}
.err{text-align:center;padding:26px 16px;color:var(--dim)}
.build{text-align:center;margin-top:10px;font-size:10.5px;color:var(--faint);
       opacity:.5;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.install{font-size:12.5px;color:var(--faint);text-align:center;margin-top:12px;
         line-height:1.55;max-width:30ch;margin-left:auto;margin-right:auto;
         /* Keeps the browser from orphaning "⋯." on a line of its own. */
         text-wrap:balance}
</style>
</head>
<body>

  <!-- Broken cloud after dark. Without it the night rows of the day screen
       drew a sun at three in the morning, because `cloudy` is «облачно с
       прояснениями» and its glyph is the sun peering through the gap. -->
  <symbol id="i-cloudy-night" viewBox="0 0 32 32"><path d="M16.4 12.8a5.6 5.6 0 0 1-6.9-7.1 5.9 5.9 0 1 0 6.9 7.1z" fill="#cfd9f5"/><path d="M23 27H12a5.4 5.4 0 0 1-.5-10.8A7 7 0 0 1 24.6 18a4.6 4.6 0 0 1-1.6 9z" fill="#aebbd8"/></symbol>

  <symbol id="i-rain" viewBox="0 0 32 32"><path d="M23 19H12a5.4 5.4 0 0 1-.5-10.8A7 7 0 0 1 24.6 10a4.6 4.6 0 0 1-1.6 9z" fill="#b3c0dc"/><g stroke="#4f92ff" stroke-width="2.2" stroke-linecap="round"><path d="M12.5 22l-1.8 5M18 22l-1.8 5M23.5 22l-1.8 5"/></g></symbol>

 </defs>
</svg>

<div class="sky" id="sky" aria-hidden="true">
  <div class="fx" id="fx"></div></div>
<!-- The two strips iOS 26 Safari actually reads. See .edge in the stylesheet:
     they are invisible (each is the colour of the sky directly behind it) and
     exist solely to be sampled. -->
<div class="edge edge-top" aria-hidden="true"></div>
<div class="edge edge-bot" aria-hidden="true"></div>

<div class="wrap">

  <div class="top">
    <button class="placebtn" id="btn-place" aria-haspopup="dialog">
      <svg class="pin" id="pin" viewBox="0 0 24 24" style="visibility:hidden"
        aria-label="по геолокации"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
      <h1 id="city">…</h1>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div id="content">
    <div class="boot" aria-hidden="true">
      <i class="ic"></i><i class="t"></i><i class="c"></i>
      <i class="strip"></i><i class="card"></i><i class="card tall"></i>
    </div>
    <p class="sr">Загружаем погоду…</p>
  </div>

  <!-- Below the weather, on request. It began above it on the reasoning that a
       degraded reading you have to scroll to find is one you will not find --
       which is true of a *degraded reading* and false of a diagnostic. What
       actually lands here is text like "current condition 'cloudy' disagrees
       with the 11:00 column", which is addressed to whoever maintains this and
       not to whoever is deciding on a coat. Above the forecast it is a banner
       shouting about internals; below it, it is a footnote you can go and
       read. The tab itself still says when a source is unusable, which is the
       part that changes what you do. -->
  <div class="notes" id="notes"></div>

  <div class="foot">
    <span class="badge ok" id="badge"></span>
    <div class="line">
      <span id="stamp"></span><span class="sep">·</span>
      <button id="btn-refresh" style="color:var(--accent)">Обновить</button>
    </div>
  </div>

  <p class="install" id="install">
    <b>Поделиться</b> → <b>На экран «Домой»</b>. В iOS&nbsp;26 — в меню <b>⋯</b>
  </p>
</div>

<!-- Outside `.wrap`, and that placement is load-bearing rather than tidy: this
     is `position: fixed`, `.wrap` carries an animation, and a transformed
     ancestor becomes the containing block for fixed descendants. The old sheet
     lived inside `.wrap` and broke the first time an animation there grew a
     transform. Nothing fixed lives inside `.wrap` any more, and a test walks
     the ancestors to keep it that way. -->
<div class="scrim" id="scrim" aria-hidden="true"></div>
<div class="sheetfade" id="sheetfade" aria-hidden="true"></div>
<div class="screen" id="screen" role="dialog" aria-modal="true" aria-hidden="true"
     aria-labelledby="screen-title">
  <div class="navbar">
    <!-- Order matters, and not for layout: the close button is *last* in the
         DOM so it is last in the tab and VoiceOver order, matching where it
         sits on screen. It is placed in the trailing grid column by CSS. -->
    <div class="t" id="screen-title" tabindex="-1"></div>
    <button class="close" id="close" aria-label="Закрыть">
      <svg viewBox="0 0 13 13" aria-hidden="true">
        <path d="M1 1l11 11M12 1L1 12"/></svg>
    </button>
  </div>
  <div class="body" id="screen-body"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
