[project]
name = "weather"
version = "1.0.0"
description = "Self-hosted, ad-free weather PWA with three independent sources"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
# extend-, not exclude: `exclude` replaces ruff's own list, and a virtualenv
# in the checkout then lints (and `make fmt` rewrites) every installed package.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # long lines: the prose in module docstrings is deliberate
  "RUF001",  # ambiguous unicode: this codebase is *about* Cyrillic and U+2212
  "RUF002",
  "RUF003",
  "B008",    # FastAPI's Query() in a default is the documented idiom
  "SIM108",  # ternaries are not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
# Diagnostics are mounted into the running image and have to fix sys.path
# before they can import the app they are diagnosing.
"tools/route_probe.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# A deprecation fails the suite. One in this project's code is ours to fix the
# day it appears. One inside a dependency can only arrive with a change to a
# lock, which is a reviewed diff: the bump that brings it either deals with it
# or adds an `ignore` line here naming the message and the module, with the
# reason and the release that will let it go. Nothing needs one today.
#
# The third line is not redundant. Starlette, FastAPI and httpx2 issue their
# deprecations as UserWarning subclasses so that they show by default, which
# puts them outside both of the first two -- the TestClient's httpx warning
# printed on every run under the old `ignore::DeprecationWarning` for exactly
# that reason. Matched on the message, because their classes live in modules
# this file should not have to import.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "error:.*deprecat:UserWarning",
]
# A known failure must say when it stops being one (AGENTS.md, Done means).
xfail_strict = true
