name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  # The parsers read someone else's HTML. Nothing here fetches the network --
  # the fixtures are committed -- but a weekly run means a dependency that
  # breaks the parse gets noticed on a Monday rather than on the morning you
  # actually wanted the forecast.
  schedule:
    - cron: "0 6 * * 1"

# A second push supersedes the first. Three jobs times a rapid-fire afternoon
# is a queue nobody reads. The event is part of the key: the Monday run or a
# manual one for the canary must never cancel a push that is mid-release, or
# that commit is simply never shipped.
#
# Never on master, though. There a newer push queues behind a run in flight
# instead of cancelling it. Cancelling could drop a commit that was green and
# already publishing, and if the newer push was red, neither shipped -- even
# when the older one was the `git revert` DEPLOY.md gives as the rollback.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only by default. `release` asks for the one thing it needs, on its own.
#
# Every action is pinned to a commit, with its tag beside it. A tag can be
# moved to other code by whoever controls the action's repository (it has
# happened, to tj-actions/changed-files in 2025), and the job holding
# `packages: write` publishes what the server deploys within minutes.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

# Every `run:` step under a named bash, which GitHub invokes as
# `bash -e -o pipefail`. Its default for an unnamed shell is `bash -e` without
# pipefail, so `pytest ... | tee log` exited with tee's status -- always 0 --
# and a red suite passed the gate. Harmless while the gate only drew a tick;
# not once a green run on master deploys. Found and fixed 2026-10-01, the day
# it started deploying.
defaults:
  run:
    shell: bash

# Every job has a timeout, at several times the run it was measured at (the
# first run on master, 2026-10-01: lint + unit 19 s, browser 2 min 16 s, image
# 33 s, publish 30 s; the canary is one request with a 30 s timeout). Without
# one, GitHub waits six hours -- and a browser test that hangs on master, where
# runs queue rather than cancel, would hold every push behind it for that long.
jobs:
  test:
    name: lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      # What the image installs, and the tools as requirements-dev.txt pins
      # them, each from its hash-lock and nothing resolved here. Together on
      # purpose: a package both need has to be one version in both, and pip
      # refuses the pair if `make lock` was not what wrote them.
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
      - name: lint
        run: ruff check .
      - name: unit + parser + routing tests
        # No network required or wanted: the fixtures are the ground truth.
        # test_ui.py has a job of its own.
        #
        # `-p no:randomly --strict-markers` and a zero-skip rule: a skipped test
        # is not a passing test. Four of these sat skipped for want of a fixture
        # and one of them was asserting a provenance key that does not exist --
        # it could never have passed, and nobody could tell, because it had
        # never run. Everything outside the browser suite has its inputs
        # committed and must therefore execute. A known failure is marked
        # `xfail(strict=True)` instead: it runs, it is not a skip, and it
        # fails the job the day it unexpectedly passes.
        run: |
          pytest -q --ignore=tests/test_ui.py -p no:randomly --strict-markers -rs | tee /tmp/unit.log
          if grep -qE '[0-9]+ skipped' /tmp/unit.log; then
            echo "::error::tests were skipped -- a skipped test is not a passing test"
            exit 1
          fi

  ui:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      # The same two locks as `test`. They carry pillow, which matters here:
      # the status-bar seam tests compare pixels, and without it they skip --
      # five tests that had never once run here.
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - name: browser tests
        # One run, read twice. These tests skip themselves when Chromium or
        # pillow is missing, which is right on a laptop and a silent green tick
        # here; a job that cannot fail is not testing anything. So it fails
        # unless the suite ran, and unless every skip is the one known data
        # condition: fixtures recorded on different days (MIXED in the suite).
        run: |
          pytest -q -rs tests/test_ui.py 2>&1 | tee /tmp/ui.log
          grep -qE '[0-9]+ passed' /tmp/ui.log || {
            echo "::error::the browser suite ran nothing"; exit 1; }
          if grep -E '^SKIPPED' /tmp/ui.log | grep -v 'the fixtures are from different days'; then
            echo "::error::the browser suite skipped tests it should have run"; exit 1
          fi

  image:
    name: image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Builds for the platform the VPS actually runs, because a Dockerfile
      # that only works on the arch you happen to be sitting at is a deploy-day
      # surprise -- and this repo has already had one (`exec format error`).
      # Not pushed: `release` publishes, and only once this job and both test
      # suites have passed on a push to master -- *this* image, written out
      # once and handed over, not a second build. A rebuild there re-resolved
      # the base tag and every `>=` requirement minutes after the tests ran,
      # so what shipped was never quite what was checked.
      - name: build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: weather:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_BUILD=${{ github.sha }}
            APP_BUILT_AT=${{ steps.built.outputs.at }}
          outputs: type=docker,dest=/tmp/weather.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker load -i /tmp/weather.tar
      # A built image is not yet a running app: a missing module, a bad CMD or
      # a user who cannot read the code all build fine. Start it and ask the
      # two routes that touch no upstream. The build it reports must be this
      # commit, or the stamp is broken and `make status` would lie after every
      # deploy.
      #
      # Started locked down, the way the server should run it, and then held
      # to its own HEALTHCHECK, which the server's deploy waits for -- polled
      # every 2 s instead of 60, the command untouched (DECISIONS.md §42).
      - name: the image starts and answers
        run: |
          docker run -d --name app -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            --health-interval 2s \
            weather:ci
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/weather/api/version | tee /tmp/version.json
          echo
          grep -q "\"$GITHUB_SHA\"" /tmp/version.json || {
            echo "::error::/api/version does not report this commit"; exit 1; }
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy || {
            echo "::error::the container never reported healthy"; exit 1; }
      - name: container log
        if: failure()
        run: docker logs app || true
      - name: hand the checked image to release
        if: github.repository == 'mureev/weather' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: /tmp/weather.tar
          retention-days: 1

  # Delivery (2026-10-01). When every job above passes on a push to master,
  # publish the image as :master and :sha-<short>. That is the whole of this
  # repo's part: a tool on the server, configured in the owner's infrastructure
  # repo, polls :master every two minutes, deploys a new digest behind a health
  # check through the reverse proxy, and rolls back by itself if the check
  # fails. Nothing here holds a credential for the server, and nothing needs one.
  release:
    name: publish image
    needs: [test, ui, image]
    # A fork's master is not this repository's production, and its token
    # could not publish here anyway.
    if: github.repository == 'mureev/weather' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    # what every job has: a job's own list replaces the default
      packages: write   # the push to ghcr.io, and the one write in this workflow
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: /tmp
      - run: docker load -i /tmp/weather.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promoted, not rebuilt: the image `image` started and asked for this
      # commit, under the two names the server and DEPLOY.md use.
      - name: publish
        run: |
          for tag in master "sha-${GITHUB_SHA::7}"; do
            docker tag weather:ci "ghcr.io/mureev/weather:$tag"
          done
          docker push --all-tags ghcr.io/mureev/weather

  # Not part of the gate: `release` does not wait for it and a push never runs
  # it. It reads the live site's forecast, so a red tick here can mean "the
  # box is rebooting" as easily as "Yandex redesigned". It runs on the schedule
  # because the suite tests committed fixtures and is therefore structurally
  # incapable of noticing that the real pages have moved.
  canary:
    name: upstreams unchanged
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: has an upstream changed under us?
        # Gismeteo is tolerated as missing. Of the three it is the one that
        # goes dark for reasons that are not a redesign -- an address block
        # (DECISIONS.md §7), an outage that answers 200 (§32) -- and this job
        # is about drift, not outages. Its line still prints, with the reason
        # the server gave.
        run: python3 tools/canary.py --allow-missing gismeteo
