name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  # The parsers read someone else's HTML. Nothing here fetches the network --
  # the fixtures are committed -- but a weekly run means a dependency that
  # breaks the parse gets noticed on a Monday rather than on the morning you
  # actually wanted the forecast.
  schedule:
    - cron: "0 6 * * 1"

# A second push supersedes the first. Three jobs times a rapid-fire afternoon
# is a queue nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

# Every `run:` step under a named bash, which GitHub invokes as
# `bash -e -o pipefail`. Its default for an unnamed shell is `bash -e` without
# pipefail, so `pytest ... | tee log` exited with tee's status -- always 0 --
# and a red suite passed the gate. Harmless while the gate only drew a tick;
# not once a green run on master deploys. Found and fixed 2026-10-01, the day
# it started deploying.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - name: lint
        run: ruff check .
      - name: unit + parser + routing tests
        # No network required or wanted: the fixtures are the ground truth.
        # test_ui.py is excluded here and has a job of its own, but it is still
        # *collected* -- test_docs.py asserts the README's test count, and that
        # number has to mean the same thing in every environment.
        #
        # `-p no:randomly --strict-markers` and a zero-skip rule: a skipped test
        # is not a passing test. Four of these sat skipped for want of a fixture
        # and one of them was asserting a provenance key that does not exist --
        # it could never have passed, and nobody could tell, because it had
        # never run. Everything outside the browser suite has its inputs
        # committed and must therefore execute. A known failure is marked
        # `xfail(strict=True)` instead: it runs, it is not a skip, and it
        # fails the job the day it unexpectedly passes.
        run: |
          pytest -q --ignore=tests/test_ui.py -p no:randomly --strict-markers -rs | tee /tmp/unit.log
          if grep -qE '[0-9]+ skipped' /tmp/unit.log; then
            echo "::error::tests were skipped -- a skipped test is not a passing test"
            exit 1
          fi

  ui:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: browser tests
        run: pytest -q tests/test_ui.py
      - name: fail if they all skipped
        # These tests skip themselves when Chromium is missing, which is right
        # on a laptop and a silent green tick here. A job that cannot fail is
        # not testing anything.
        run: |
          pytest -q tests/test_ui.py 2>&1 | tee /tmp/ui.log
          grep -qE '[0-9]+ passed' /tmp/ui.log || {
            echo "::error::the browser suite ran nothing"; exit 1; }

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds for the platform the VPS actually runs, because a Dockerfile
      # that only works on the arch you happen to be sitting at is a deploy-day
      # surprise -- and this repo has already had one (`exec format error`).
      # Not pushed: `release` publishes, and only once this job and both test
      # suites have passed on a push to master.
      - name: build amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            APP_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Delivery (2026-10-01). When every job above passes on a push to master,
  # publish the image as :master and :sha-<short>. That is the whole of this
  # repo's part: a tool on the server, configured in the owner's infrastructure
  # repo, polls :master every two minutes, deploys a new digest behind a health
  # check through the reverse proxy, and rolls back by itself if the check
  # fails. Nothing here holds a credential for the server, and nothing needs one.
  release:
    name: publish image
    needs: [test, ui, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mureev/weather
          tags: |
            type=raw,value=master
            type=sha,format=short,prefix=sha-
      - id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD=${{ github.sha }}
            APP_BUILT_AT=${{ steps.built.outputs.at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Not part of the gate: `release` does not wait for it and a push never runs
  # it. It reads the live site's /api/health, so a red tick here can mean "the
  # box is rebooting" as easily as "Yandex redesigned". It runs on the schedule
  # because the suite tests committed fixtures and is therefore structurally
  # incapable of noticing that the real pages have moved.
  canary:
    name: upstreams unchanged
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: has an upstream changed under us?
        # Gismeteo is tolerated as missing. Of the three it is the one that
        # goes dark for reasons that are not a redesign -- an address block
        # (DECISIONS.md §7), an outage that answers 200 (§32) -- and this job
        # is about drift, not outages. Its line still prints, with the reason
        # the server gave.
        run: python3 tools/canary.py --allow-missing gismeteo
