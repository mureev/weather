name: audit

# Known vulnerabilities in what ships: every pin in requirements.lock against
# PyPI's advisory database. An alarm, not part of the deploy gate -- by the time
# an advisory lands the vulnerable version is already live, so blocking the
# next push would protect nothing (DECISIONS.md §42). A red run means
# `make lock UPGRADE='--upgrade-package <name>'` and push.
#
# Run with pipx rather than from the dev lock: nothing here can change what
# `release` publishes, so it does not need the gate's hashes.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: [requirements.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run --spec pip-audit==2.10.1 pip-audit --strict --disable-pip --require-hashes -r requirements.lock
